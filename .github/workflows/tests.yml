name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux GUI libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - name: Install locked dependencies
        run: |
          python -m pip install uv
          uv sync --locked --extra dev
      - name: Check source and tests
        run: uv run --locked ruff check src tests
      - name: Run tests
        run: uv run --locked pytest tests -q
